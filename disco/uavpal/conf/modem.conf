MODEM_PROFILE=auto
# Supported profiles: auto, huawei_hilink, huawei_stick, generic_ethernet.
# Space-separated USB ID allowlist. Use vendor:* or vendor:product.
# The default keeps the original Huawei-only startup behavior.
MODEM_USB_IDS=12d1:*
# Optional fixed Ethernet modem interface. Leave empty to auto-detect
# eth*, usb*, wwan*, and enx* interfaces, excluding eth0.
MODEM_ETH_IFACE=
